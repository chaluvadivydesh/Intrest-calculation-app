<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c63ff">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="description" content="Professional Interest Calculator - Custom Lending System">
<link rel="manifest" href="manifest.json">
<title>Interest Calculator Pro</title>
<link rel="stylesheet" href="style.css?v=12">
<script src="script.js?v=12" defer></script>
</head>
<body class="light">
<div class="app-wrapper">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-icon">₹</div>
      <div>
        <h1 class="app-title">Interest Pro</h1>
        <p class="app-sub">Custom Lending Calculator</p>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="historyBtn" title="History">📋</button>
      <button class="icon-btn" id="darkToggle" title="Toggle Dark Mode">🌙</button>
    </div>
  </header>

  <main class="main-content">

    <!-- Count Selector Bar — no PDF button here anymore -->
    <div class="count-bar card">
      <div class="count-bar-inner">
        <label for="calcCountSelect">Number of Calculations</label>
        <select id="calcCountSelect" class="input-field select-field count-select">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>
    </div>

    <!-- Dynamic calculation sections injected here by JS -->
    <div id="calcSectionsContainer"></div>

    <!-- Grand Summary — shown only when ALL calculations are completed (2+) -->
    <div id="grandSummary" style="display:none" class="card grand-summary-card">
      <div class="grand-title">Grand Total Summary</div>
      <div class="grand-row">
        <span class="grand-label">Grand Total Interest</span>
        <span class="grand-value" id="grandInterest">₹0</span>
      </div>
      <div class="grand-row">
        <span class="grand-label">Grand Final Amount</span>
        <span class="grand-value grand-final" id="grandFinal">₹0</span>
      </div>
    </div>

    <!-- PDF Button — shown at bottom after all calculations are done -->
    <div id="pdfBtnWrap" style="display:none" class="pdf-bottom-wrap">
      <button class="btn-pdf btn-pdf-large" id="pdfBtn">📄 Download All as PDF</button>
    </div>

  </main>

  <!-- History Panel -->
  <div class="history-overlay" id="historyOverlay" style="display:none">
    <div class="history-panel">
      <div class="history-header">
        <h2>📋 History <span class="badge" id="historyCount">0</span></h2>
        <button class="icon-btn" id="closeHistory">✕</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No calculations yet.</div>
      </div>
      <button class="btn-reset" id="clearHistory" style="width:100%;margin-top:1rem">🗑 Clear History</button>
    </div>
  </div>

</div>

</body>
</html>
